[package]
name = "spf-flatten"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Flatten SPF records to stay within the RFC 7208 DNS lookup and size limits"
license = "GPL-3.0-or-later"
authors = ["Nic Boet"]
readme = "README.md"
repository = "https://github.com/nabbi/spf-flatten"
exclude = [".github/"]
keywords = ["spf", "dns", "email", "flatten", "dmarc"]
categories = ["command-line-utilities", "network-programming", "email"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hickory-resolver = "0.26.3"
route-summarization = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt"] }
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1"
serde_json = "1.0.154"
